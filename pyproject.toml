[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veriscript"
version = "0.1.0"
description = "VeriScript: a hybrid heuristic-transformer cascade for AI-generated text detection"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "torch>=2.1",
    "transformers>=4.40,<5",
    "datasets>=2.18",
    "accelerate>=0.30",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "spacy>=3.7",
    "numpy>=1.24,<2",
    "pandas>=2.0",
    "pyarrow>=14",
    "matplotlib>=3.7",
    "pdfplumber>=0.10",
    "python-docx>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "streamlit>=1.30",
    "typer>=0.12",
    "pyyaml>=6",
    "joblib>=1.3",
    "requests>=2.31",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
veriscript = "veriscript.cli:app"

[tool.setuptools.packages.find]
include = ["veriscript*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs the GPT-2 reference model (downloads ~500 MB on first run)"]
